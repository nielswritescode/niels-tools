<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice Timer — Niels' Tools</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="timer.css">
</head>
<body>
<div class="practice-flash" id="practiceFlash" aria-hidden="true">PRACTICE</div>
<div class="wrap">
  <a class="back-link" href="../../index.html">&larr; All tools</a>
  <header class="site-header">
    <h1>Practice Timer</h1>
    <p class="tagline">Simple or multi-round countdown timer.</p>
  </header>

  <div class="panel timer-card">
    <div class="row center">
      <button type="button" class="pill timer-mode-pill active" data-timer-mode="simple">Simple Timer</button>
      <button type="button" class="pill timer-mode-pill" data-timer-mode="multi">Multi Timer</button>
    </div>

    <div class="timer-setup" id="timerSetup">
      <div class="timer-picker" id="timerPicker">
        <div class="row timer-duration-row center" id="timerDurationRow"></div>
        <div class="row timer-duration-controls center">
          <button type="button" class="pill" id="timerAddDurationBtn">+ Add timer</button>
          <button type="button" class="pill" id="timerRemoveDurationBtn">Remove timer</button>
        </div>
        <div class="timer-sequence" id="timerSequence" hidden></div>
        <div class="row timer-multi-actions center" id="timerMultiActions" hidden>
          <button type="button" class="btn-ghost timer-symbol-btn" id="timerReturnBtn" aria-label="Return — undo last">&#10005;</button>
          <button type="button" class="pill timer-symbol-btn" id="timerLoopBtn" aria-label="Loop">&#8734;</button>
          <button type="button" class="btn-main timer-symbol-btn" id="timerConfirmBtn" aria-label="Confirm">&#10003;</button>
        </div>
      </div>
    </div>

    <div class="timer-running" id="timerRunning" hidden>
      <div class="timer-running-sequence-row" id="timerRunningSequenceRow">
        <div class="timer-sequence" id="timerRunningSequence"></div>
        <span class="timer-loop-indicator" id="timerLoopIndicator" aria-label="Looping" hidden>&#8734;</span>
      </div>
      <button type="button" class="timer-countdown" id="timerCountdown" aria-label="Stop timer">0:00</button>
    </div>
  </div>

  <details class="panel collapsible-panel" id="settingsDetails">
    <summary>Settings</summary>
    <div class="collapsible-body">
      <div class="row">
        <div class="label">Timer sound</div>
        <button type="button" class="pill timer-sound-pill active" data-timer-sound="chime">Chime</button>
        <button type="button" class="pill timer-sound-pill" data-timer-sound="bell">Bell</button>
        <button type="button" class="pill timer-sound-pill" data-timer-sound="beep">Beep</button>
        <button type="button" class="pill timer-sound-pill" data-timer-sound="gong">Gong</button>
        <button type="button" class="pill timer-sound-pill" data-timer-sound="ascend">Ascend</button>
        <button type="button" class="pill timer-sound-pill" data-timer-sound="waves">Waves</button>
        <button type="button" class="btn-ghost" id="timerSoundPreviewBtn">Preview</button>
      </div>
      <div class="row" style="margin-top:14px;">
        <div class="label">Timer volume</div>
        <input type="range" id="timerVolumeSlider" min="0" max="100" step="5" value="70">
        <span class="range-value" id="timerVolumeValue">70%</span>
      </div>
    </div>
  </details>

  <dialog class="timer-add-dialog" id="timerAddDialog">
    <form class="timer-add-form" id="timerAddForm">
      <div class="label">New timer</div>
      <div class="row center">
        <button type="button" class="pill timer-add-unit-pill active" data-unit="minutes">Minutes</button>
        <button type="button" class="pill timer-add-unit-pill" data-unit="seconds">Seconds</button>
      </div>
      <div class="row center">
        <input type="number" id="timerAddValueInput" min="1" max="180" value="5">
      </div>
      <div class="row center">
        <button type="button" class="btn-ghost" id="timerAddCancelBtn">Cancel</button>
        <button type="submit" class="btn-main">Add</button>
      </div>
    </form>
  </dialog>
</div>
<script src="timer.js"></script>
</body>
</html>
